name: fonli_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.0

dependencies:
  country_flags: ^4.1.2
  dio: ^5.9.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  fuzzywuzzy: ^1.2.0
  intl: ^0.20.2
  json_annotation: ^4.10.0
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  posthog_flutter: ^5.34.0
  shared_preferences: ^2.5.4
  top_snackbar_flutter: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.12.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/assets/

flutter_launcher_icons:
  image_path: "lib/assets/icon/fonli-icon.png"
  android: "launcher_icon"
  ios: true